xt></g><g data-actu-node="sumcsr" class="a-on "><rect class="a-box" x="1200" y="780" width="250" height="70"/><text class="a-title " x="1325" y="808" text-anchor="middle">EXP_SUM CSR</text><text class="a-sub" x="1325" y="830" text-anchor="middle">software reads full sum</text></g><text class="a-port" x="880" y="265">N</text><text class="a-port" x="880" y="540">D</text><text class="a-caption" x="615" y="395">NUMERATOR CANDIDATES</text><text class="a-caption" x="615" y="625">DIVISOR CANDIDATES</text><text class="a-caption" x="927" y="258">aligned numerator</text><text class="a-caption" x="1490" y="592">direct r</text><text class="a-caption" x="520" y="845">original x / sign payload</text><text class="a-caption" x="1500" y="740">direct EXP result</text><text class="a-caption" x="1070" y="875">SOFTMAX: read S, then launch mode 7</text><text class="a-caption" x="44" y="912">Functional result dependencies · dim ≠ clock gated · classification / valid / alignment registers abstracted</text></svg><text x="38" y="1100" fill="#8c9eb5" font-family="monospace" font-size="12">RTL mode 5 · Source-derived functional view · BF16 stream / BF22 arithmetic · see actu-pipeline.md for RTL anchors</text></svg>