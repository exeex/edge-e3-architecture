or="middle">range → exp2 → pack</text></g><g data-actu-node="scalar" class="a-on "><rect class="a-box" x="200" y="100" width="160" height="70"/><text class="a-title " x="280" y="128" text-anchor="middle">Scalar</text><text class="a-sub" x="280" y="150" text-anchor="middle">m / epsilon / S</text></g><g data-actu-node="one" class="a-dim "><rect class="a-box" x="600" y="100" width="150" height="55"/><text class="a-title " x="675" y="128" text-anchor="middle">1</text><text class="a-sub" x="675" y="150" text-anchor="middle">constant</text></g><g data-actu-node="subtract" class="a-dim "><rect class="a-box" x="600" y="210" width="150" height="70"/><text class="a-title " x="675" y="238" text-anchor="middle">1 − e</text><text class="a-sub" x="675" y="260" text-anchor="middle">tanh numerator</text></g><g data-actu-node="add" class="a-dim a-den-node"><rect class="a-box" x="600" y="430" width="150" height="70"/><text class="a-title " x="675" y="458" text-anchor="middle">1 + e</text><text class="a-sub" x="675" y="480" text-anchor="middle">fused denominator</text></g><g data-actu-node="epsilon" class="a-dim a-den-node"><rect class="a-box" x="600" y="650" width="150" height="70"/><text class="a-title " x="675" y="678" text-anchor="middle">x + epsilon</text><text class="a-sub" x="675" y="700" text-anchor="middle">RSQRT divisor</text></g><g data-actu-node="nselect" class="a-dim "><path class="a-box" d="M780 180L860 210V340L780 370Z"/><text class="a-title a-mux-title" x="820" y="270" text-anchor="middle">N select</text><text class="a-sub" x="820" y="292" text-anchor="middle">mode</text></g><g data-actu-node="dselect" class="a-dim a-den-node"><path class="a-box" d="M780 430L860 460V640L780 670Z"/><text class="a-title a-mux-title" x="820" y="545" text-anchor="middle">D select</text><text class="a-sub" x="820" y="567" text-anchor="middle">mode</text></g><g data-actu-node="rcp" class="a-dim a-den-node"><rect class="a-box" x="960" y="510" width="160" height="80"/><text class="a-title " x=