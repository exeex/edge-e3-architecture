<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1130" viewBox="0 0 2070 1130"><rect width="2070" height="1130" fill="#0c111b"/><text x="38" y="44" fill="#dce5f0" font-family="sans-serif" font-size="28" font-weight="700">Edge E3 · ACTU / Softmax · Exp + Sum</text><text x="38" y="78" fill="#6ee7cf" font-family="monospace" font-size="17">Pass 1: eᵢ = exp(xᵢ − m), S = Σeᵢ</text><text x="38" y="109" fill="#8c9eb5" font-family="monospace" font-size="13">eᵢ = exp(xᵢ − m)</text><svg x="20" y="135" width="2030" height="930" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2030 930" role="img" aria-labelledby="actu-svg-title actu-svg-desc"><title id="actu-svg-title">ACTU shared numerator and denominator paths — Softmax · Exp + Sum</title><desc id="actu-svg-desc">Front half prepares EXP, numerator and divisor; back half computes reciprocal or reciprocal square root and composes the result. Softmax reduction and normalization are separate software passes.</desc><style>.a-bg{fill:var(--bg,#0c111b)}.a-region{fill:none;stroke:var(--rule,#29394e);stroke-dasharray:5 6}.a-box{fill:var(--panel,#131d2b);stroke:var(--ink,#dce5f0);stroke-width:1.4}.a-title{font:600 18px sans-serif;fill:var(--ink,#dce5f0)}.a-sub{font:11px monospace;fill:var(--muted,#8c9eb5)}.a-caption{font:11px monospace;fill:var(--muted,#8c9eb5)}.a-heading{font:600 15px monospace;fill:var(--ink,#dce5f0)}.a-wire{fill:none;stroke-width:2;stroke-linejoin:round}.a-data{stroke:#85adff}.a-exp{stroke:#6ee7cf}.a-numerator{stroke:#6ee7cf}.a-denominator{stroke:#ffc578}.a-control{stroke:#b39be8;stroke-dasharray:5 5}.a-arrow-data{fill:#85adff}.a-arrow-exp,.a-arrow-numerator{fill:#6ee7cf}.a-arrow-denominator{fill:#ffc578}.a-arrow-control{fill:#b39be8}.a-dim{opacity:.16}.a-on{opacity:1}.a-on .a-box{stroke:#6ee7cf}.a-mux-title{font-size:13px}.a-on.a-den-node .a-box{stroke:#ffc578}.a-port{font:12px monospace;fill:var(--ink,#dce5f0)}</style><defs><marker id="actu-arrow-data" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" class="a-arrow-data"/></marker><marker id="actu-arrow-exp" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" class="a-arrow-exp"/></marker><marker id="actu-arrow-numerator" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" class="a-arrow-numerator"/></marker><marker id="actu-arrow-denominator" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" class="a-arrow-denominator"/></marker><marker id="actu-arrow-control" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8Z" class="a-arrow-control"/></marker></defs><rect class="a-bg" width="2030" height="930"/><text class="a-heading" x="44" y="42">01 / FRONT HALF · NUMERATOR &amp; DIVISOR PREPARE</text><text class="a-heading" x="924" y="42">02 / BACK HALF · DENOMINATOR INVERSE &amp; COMPOSE</text><rect class="a-region" x="24" y="72" width="850" height="815"/><rect class="a-region" x="904" y="72" width="1102" height="815"/><path data-actu-path="input-prepare" class="a-wire a-data a-on" d="M160 295H200" marker-end="url(#actu-arrow-data)"/><path data-actu-path="prepare-exp" class="a-wire a-exp a-on" d="M360 295H400" marker-end="url(#actu-arrow-exp)"/><path data-actu-path="scalar-prepare" class="a-wire a-control a-on" d="M280 170V260" marker-end="url(#actu-arrow-control)"/><path data-actu-path="exp-subtract" class="a-wire a-numerator a-dim" d="M560 295H580V245H600" marker-end="url(#actu-arrow-numerator)"/><path data-actu-path="subtract-n" class="a-wire a-numerator a-dim" d="M750 245H780" marker-end="url(#actu-arrow-numerator)"/><path data-actu-path="one-n" class="a-wire a-numerator a-dim" d="M750 127H765V205H780" 