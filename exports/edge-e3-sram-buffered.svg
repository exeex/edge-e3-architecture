<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" role="img" aria-label="SRAM scheduling: buffered" style="font-family:ui-monospace,monospace"><rect width="1140" height="760" fill="#101824"/><text x="36" y="43" fill="#dce5f2" font-size="22" text-anchor="start">BUFFERED CLIENTS / MATCH BEAT RATE TO CONSUMPTION</text><text x="36" y="72" fill="#9aaabd" font-size="14" text-anchor="start">Current wide schedule · logical service view, not a literal placement or a cycle trace</text><rect x="40" y="280" width="245" height="90" rx="3" fill="#172130" stroke="#6da8fa"/><text x="56" y="309" fill="#6da8fa" font-size="18" text-anchor="start">128-bit slow service</text><text x="56" y="333" fill="#9aaabd" font-size="13" text-anchor="start">Phase-qualified beats</text><rect x="380" y="140" width="300" height="90" rx="3" fill="#172130" stroke="#57d6bd"/><text x="396" y="169" fill="#57d6bd" font-size="18" text-anchor="start">ACTU / CMPU queues</text><text x="396" y="193" fill="#9aaabd" font-size="13" text-anchor="start">Read reservations + write FIFO</text><rect x="380" y="420" width="300" height="90" rx="3" fill="#172130" stroke="#efbd69"/><text x="396" y="449" fill="#efbd69" font-size="18" text-anchor="start">LSU request / response</text><text x="396" y="473" fill="#9aaabd" font-size="13" text-anchor="start">Lane adapter / backpressure</text><rect x="810" y="100" width="245" height="80" rx="3" fill="#172130" stroke="#57d6bd"/><text x="826" y="129" fill="#57d6bd" font-size="18" text-anchor="start">ACTU</text><text x="826" y="153" fill="#9aaabd" font-size="13" text-anchor="start">Element stream</text><rect x="810" y="230" width="245" height="80" rx="3" fill="#172130" stroke="#57d6bd"/><text x="826" y="259" fill="#57d6bd" font-size="18" text-anchor="start">CMPU</text><text x="826" y="283" fill="#9aaabd" font-size="13" text-anchor="start">Operand streams</text><rect x="810" y="420" width="245" height="90" rx="3" fill="#172130" stroke="#efbd69"/><text x="826" y="449" fill="#efbd69" font-size="18" text-anchor="start">LSU</text><text x="826" y="473" fill="#9aaabd" font-size="13" text-anchor="start">Scalar load / store</text><path d="M285 305H330V185H380" fill="none" stroke="#57d6bd" stroke-width="2" /><path d="M285 345H330V465H380" fill="none" stroke="#efbd69" stroke-width="2" /><path d="M680 170H740V140H810" fill="none" stroke="#57d6bd" stroke-width="2" /><path d="M680 205H740V270H810" fill="none" stroke="#57d6bd" stroke-width="2" /><path d="M680 465H810" fill="none" stroke="#efbd69" stroke-width="2" /><text x="40" y="570" fill="#57d6bd" font-size="14" text-anchor="start">BUFFERING LAYER</text><text x="40" y="606" fill="#9aaabd" font-size="15" text-anchor="start">Consumers drain buffered beats at their own rate. Queues absorb bursts; they do not create bandwidth.</text><text x="40" y="642" fill="#9aaabd" font-size="14" text-anchor="start">ACTU / CMPU share the accelerator I/O queues. LSU and accelerator requests share local admission.</text><text x="40" y="678" fill="#9aaabd" font-size="14" text-anchor="start">The LSU boundary is a direct ready / response adapter, not another identical accelerator FIFO.</text><text x="40" y="714" fill="#9aaabd" font-size="14" text-anchor="start">Queue capacity, in-flight reservations and dependencies can all stop new requests.</text></svg>